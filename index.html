<style>
/* Layout: full-bleed map; floating title card + category chips on top, list button bottom-left,
   locate/zoom bottom-right, a bottom sheet for spot details and another for the full list */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1d2333; --muted:#5f6878; --line:#e3e6eb; --soft:#f1f3f6;
  --navy:#26315f; --tip:#eef2fa; --photo:#e0e3ea; --me:#2f6fec;
  --c-shrine:#c0392b; --c-history:#8a5a1e; --c-city:#3b5bb5; --c-nature:#3f7d58; --c-sea:#2f8590; --c-event:#c77700;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --shadow:0 6px 20px rgba(29,35,51,.12);
  --tiles:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141821; --surface:#1d222d; --ink:#e8ebf1; --muted:#9ea6b5; --line:#2e3441; --soft:#252b37;
  --navy:#3a4a8f; --tip:#232b3d; --photo:#2a303c; --me:#6b9bff;
  --c-shrine:#e0675a; --c-history:#c08b4a; --c-city:#7090e6; --c-nature:#6bb388; --c-sea:#5bb5bf; --c-event:#e8a33a;
  --shadow:0 6px 20px rgba(0,0,0,.4); --tiles:brightness(.78) contrast(1.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141821; --surface:#1d222d; --ink:#e8ebf1; --muted:#9ea6b5; --line:#2e3441; --soft:#252b37;
  --navy:#3a4a8f; --tip:#232b3d; --photo:#2a303c; --me:#6b9bff;
  --c-shrine:#e0675a; --c-history:#c08b4a; --c-city:#7090e6; --c-nature:#6bb388; --c-sea:#5bb5bf; --c-event:#e8a33a;
  --shadow:0 6px 20px rgba(0,0,0,.4); --tiles:brightness(.78) contrast(1.05); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{font-family:var(--body);background:var(--bg)}
.leaflet-tile-pane{filter:var(--tiles)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}

/* top */
.top{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.titlecard{pointer-events:auto;align-self:flex-start;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 16px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;max-width:100%}
.titlecard h1{margin:0;font-family:var(--display);font-size:20px;line-height:1.3;letter-spacing:-.01em}
.titlecard .sub{font-size:13px;color:var(--muted)}
.chips{pointer-events:none;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px}
.chips::-webkit-scrollbar{display:none}
.chip{pointer-events:auto;flex:none;font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(29,35,51,.08);cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip b{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{opacity:.45}
.chip.only{border-color:var(--ink)}

/* pins */
.pinwrap{background:none;border:0}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.28);display:grid;place-items:center;transition:transform .15s}
.pin span{transform:rotate(45deg);color:#fff;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pin.ev::after{content:"";position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--c-event);border:2px solid #fff}
.pin.sel{transform:rotate(-45deg) scale(1.3)}
.me-dot{width:16px;height:16px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--me) 25%,transparent)}

/* controls */
.btn-list{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:500;font:inherit;font-size:16px;font-weight:600;color:#fff;background:var(--navy);border:0;border-radius:999px;padding:13px 22px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.ctl{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:500;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.ctl .grp{display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.ctl button{font:inherit;width:46px;height:46px;border:0;background:var(--surface);color:var(--ink);font-size:22px;cursor:pointer;display:grid;place-items:center}
.ctl .grp button+button{border-top:1px solid var(--line)}
.ctl .loc{border-radius:12px;box-shadow:var(--shadow)}
.ctl .loc.on{color:var(--me)}
.ctl svg{width:22px;height:22px}
button:focus-visible,.row:focus-visible{outline:2px solid var(--me);outline-offset:2px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:900;background:rgba(15,18,26,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;max-width:640px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:86%;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s}
.sheet.on{transform:none;visibility:visible;pointer-events:auto;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet .scroll{overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.x{position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(30,34,44,.62);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.handle{position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:rgba(255,255,255,.8);z-index:2}
.photo{position:relative;aspect-ratio:4/3;max-height:42vh;width:100%;background:var(--photo);border-radius:20px 20px 0 0;overflow:hidden}
.track{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.photo .none{color:var(--muted);font-size:14px;text-align:center;padding:0 24px;line-height:1.7}
.credit{position:absolute;right:8px;bottom:8px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px;text-decoration:none;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{position:absolute;left:12px;top:14px;z-index:2;font-size:12px;font-weight:600;color:#fff;background:rgba(20,24,33,.6);padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.dots{position:absolute;left:0;right:0;bottom:10px;z-index:2;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 2px rgba(0,0,0,.4);transition:width .2s,background .2s}
.dots i.on{width:18px;border-radius:4px;background:#fff}
.nav{position:absolute;top:50%;z-index:2;width:38px;height:38px;margin-top:-19px;border:0;border-radius:50%;background:rgba(20,24,33,.55);color:#fff;font-size:20px;cursor:pointer;display:none;place-items:center}
.nav.prev{left:10px}.nav.next{right:10px}
.nav[disabled]{opacity:0;pointer-events:none}
@media (hover:hover) and (pointer:fine){.nav{display:grid}}
.body{padding:18px 20px 0;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta .cat{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-weight:600}
.meta .cat i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.evtag{font-size:12px;font-weight:600;color:var(--c-event);border:1px solid var(--c-event);border-radius:999px;padding:1px 8px}
.body h2{margin:0;font-family:var(--display);font-size:clamp(24px,7vw,30px);line-height:1.25;text-wrap:balance}
.jp{font-size:14px;color:var(--muted);margin-top:-4px}
.ds{margin:0;font-size:15.5px;line-height:1.75;max-width:62ch}
.tip{background:var(--tip);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.7}
.tip b{color:var(--navy);margin-right:6px}
:root[data-theme="dark"] .tip b{color:var(--me)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip b{color:var(--me)}}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.acts a{flex:1 1 140px;text-align:center;font-size:14.5px;font-weight:600;text-decoration:none;border-radius:12px;padding:12px 10px;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.acts a.pri{background:var(--navy);border-color:var(--navy);color:#fff}

.list-head{padding:18px 20px 8px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line)}
.list-head h2{margin:0;font-family:var(--display);font-size:22px}
.list-head span{color:var(--muted);font-size:13px}
.list-head .x{position:static;margin-left:auto;background:var(--soft);color:var(--ink);width:36px;height:36px;font-size:18px}
.grp-t{position:sticky;top:0;background:var(--surface);padding:14px 20px 6px;font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--c);display:flex;align-items:center;gap:7px;z-index:1}
.grp-t i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.row{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center;padding:8px 20px;cursor:pointer}
.row:hover{background:var(--soft)}
.row .th{width:60px;height:60px;border-radius:10px;background:var(--photo) center/cover no-repeat;position:relative}
.row .th b{position:absolute;left:-6px;top:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--c);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid var(--surface);font-variant-numeric:tabular-nums}
.row .tx{min-width:0}
.row .nm{font-weight:600;font-size:15.5px;line-height:1.35}
.row .ar{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .evtag{margin-left:6px;vertical-align:1px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,20px);z-index:1200;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);font-size:14px;line-height:1.55;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{color:inherit;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

const CATS=[
  {k:"shrine",t:"신사·사찰"},{k:"history",t:"역사·문화"},{k:"city",t:"도심·쇼핑·맛"},
  {k:"nature",t:"자연·풍경"},{k:"sea",t:"바다·섬"}];
const catOf=k=>CATS.find(c=>c.k===k);
const cvar=k=>`var(--c-${k})`;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gmap=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const groute=s=>"https://www.google.com/maps/dir/?api=1&destination="+s.ll.join(",")+"&travelmode=transit";

$("sub").textContent=`명소 ${SPOTS.length}곳 · 10.9 – 10.12 · 핀을 눌러 사진 보기`;

/* map: GSI tiles pre-downloaded beside the page, layered from coarse to fine */
const map=L.map("map",{zoomControl:false,minZoom:9,maxZoom:18,zoomSnap:.5,attributionControl:true,tap:true});
map.attributionControl.setPrefix(false);
const ATTR='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">출처: 国土地理院</a> · 사진: Wikimedia Commons';
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",{maxNativeZoom:18,maxZoom:18,attribution:ATTR,keepBuffer:4,crossOrigin:false}).addTo(map);
map.setMaxBounds(L.latLngBounds([[32.6,129.3],[34.5,131.5]]));

/* pins */
const active=new Set(CATS.map(c=>c.k));
const markers={};
let sel=null;
function pinIcon(s,on){
  return L.divIcon({className:"pinwrap",iconSize:[34,34],iconAnchor:[17,40],
    html:`<div class="pin${s.tag?" ev":""}${on?" sel":""}" style="--c:${cvar(s.cat)}"><span>${s.n}</span></div>`});
}
SPOTS.forEach(s=>{
  const m=L.marker(s.ll,{icon:pinIcon(s,false),title:s.ko,keyboard:true,riseOnHover:true}).on("click",()=>openSpot(s.n,false));
  markers[s.n]=m; m.addTo(map);
});
function fitAll(){
  const pts=SPOTS.filter(s=>active.has(s.cat)).map(s=>s.ll);
  if(pts.length) map.fitBounds(pts,{paddingTopLeft:[24,130],paddingBottomRight:[24,90],maxZoom:13});
}
map.setView([33.59,130.40],11); fitAll();
addEventListener("load",()=>setTimeout(()=>{map.invalidateSize();fitAll()},60));
new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById("map"));

/* chips */
function renderChips(){
  const box=$("chips"); box.textContent="";
  CATS.forEach(c=>{
    const n=SPOTS.filter(s=>s.cat===c.k).length;
    const b=document.createElement("button");
    b.className="chip"; b.style.setProperty("--c",cvar(c.k));
    b.setAttribute("aria-pressed",active.has(c.k));
    if(active.size===1&&active.has(c.k)) b.classList.add("only");
    b.innerHTML=`<i></i>${esc(c.t)} <b>${n}</b>`;
    b.title="누르면 이 분류만 보기, 한 번 더 누르면 전체 보기";
    b.onclick=()=>{
      if(active.size===1&&active.has(c.k)) CATS.forEach(x=>active.add(x.k));
      else {active.clear();active.add(c.k)}
      applyFilter(); renderChips();
    };
    box.append(b);
  });
  const ev=SPOTS.filter(s=>s.tag).length;
  const e=document.createElement("button");
  e.className="chip"; e.style.setProperty("--c","var(--c-event)"); e.setAttribute("aria-pressed","true");
  e.innerHTML=`<i></i>이번 일정 한정 <b>${ev}</b>`;
  e.onclick=()=>openList(true);
  box.append(e);
}
function applyFilter(){
  SPOTS.forEach(s=>{const m=markers[s.n];
    if(active.has(s.cat)){if(!map.hasLayer(m))m.addTo(map)} else if(map.hasLayer(m)) map.removeLayer(m)});
}
renderChips();

/* sheets */
const scrim=$("scrim");
function showSheet(id){
  ["detail","list"].forEach(x=>{const el=$(x);const on=x===id;el.classList.toggle("on",on);el.setAttribute("aria-hidden",!on)});
  scrim.classList.toggle("on",id==="list");
}
function closeAll(){showSheet(null);setSel(null)}
scrim.onclick=closeAll;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
map.on("click",()=>{if($("detail").classList.contains("on"))closeAll()});

function setSel(n){
  if(sel&&markers[sel]) markers[sel].setIcon(pinIcon(SPOTS[sel-1],false)).setZIndexOffset(0);
  sel=n;
  if(n) markers[n].setIcon(pinIcon(SPOTS[n-1],true)).setZIndexOffset(1000);
}

function openSpot(n,fly){
  const s=SPOTS[n-1], c=catOf(s.cat);
  if(!active.has(s.cat)){active.add(s.cat);applyFilter();renderChips()}
  setSel(n);
  const P=s.photos||[];
  const photo=P.length
    ? `<div class="track" id="track">${P.map((p,i)=>`<div class="slide"><img src="${esc(p.u)}" alt="${esc(s.ko)} 사진 ${i+1}" ${i?'loading="lazy"':''} decoding="async"><a class="credit" href="${esc(p.s)}" target="_blank" rel="noopener">${esc(p.c)}</a></div>`).join("")}</div>
       ${P.length>1?`<span class="count" id="count">1 / ${P.length}</span><div class="dots" id="dots">${P.map((_,i)=>`<i${i?"":' class="on"'}></i>`).join("")}</div>
       <button class="nav prev" id="prev" aria-label="이전 사진" disabled>‹</button><button class="nav next" id="next" aria-label="다음 사진">›</button>`:""}`
    : `<div class="slide"><div class="none">이 명소는 공개 사진을 찾지 못했어요.<br>아래 'Google 지도'에서 사진을 볼 수 있어요.</div></div>`;
  $("detailBody").innerHTML=`
    <div class="photo" id="ph">${photo}<span class="handle"></span></div>
    <button class="x" id="closeDetail" aria-label="닫기">✕</button>
    <div class="body" style="--c:${cvar(s.cat)}">
      <div class="meta"><span class="cat"><i></i>${esc(c.t)}</span><span>· ${esc(s.area)}</span>${s.tag?`<span class="evtag">${esc(s.tag)}</span>`:""}</div>
      <h2>${esc(s.ko)}</h2>
      <div class="jp">${esc(s.jp)}</div>
      <p class="ds">${esc(s.ds)}</p>
      <div class="tip"><b>여행 팁</b>${esc(s.tip)}</div>
      <div class="acts">
        <a class="pri" href="${groute(s)}" target="_blank" rel="noopener">길찾기 (대중교통)</a>
        <a href="${gmap(s.gq)}" target="_blank" rel="noopener">Google 지도 · 사진 더 보기</a>
      </div>
    </div>`;
  $("detailBody").querySelectorAll(".slide img").forEach(img=>img.onerror=()=>{img.replaceWith(Object.assign(document.createElement("div"),{className:"none",textContent:"사진을 불러오지 못했어요."}))});
  const tr=$("track");
  if(tr&&P.length>1){
    const upd=()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);
      $("count").textContent=`${i+1} / ${P.length}`;
      $("dots").querySelectorAll("i").forEach((d,k)=>d.classList.toggle("on",k===i));
      $("prev").disabled=i===0; $("next").disabled=i===P.length-1};
    tr.addEventListener("scroll",()=>requestAnimationFrame(upd),{passive:true});
    const go=d=>{const i=Math.max(0,Math.min(P.length-1,Math.round(tr.scrollLeft/tr.clientWidth)+d));
      tr.scrollTo({left:i*tr.clientWidth,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})};
    $("prev").onclick=()=>go(-1); $("next").onclick=()=>go(1);
    tr.tabIndex=0; tr.onkeydown=e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)};
  }
  $("closeDetail").onclick=closeAll;
  $("detailBody").parentElement.scrollTop=0;
  $("detailBody").scrollTop=0;
  showSheet("detail");
  // keep the pin visible above the sheet
  const sheetH=Math.min(innerHeight*.86,$("detail").offsetHeight||innerHeight*.7);
  const topH=document.querySelector(".top").getBoundingClientRect().bottom;
  const visTop=Math.min(topH,innerHeight*.35), visBot=Math.max(innerHeight-sheetH,visTop+60);
  const targetY=(visTop+visBot)/2+20;
  // pan only; zoom changes are left to the user's own gestures
  const z=map.getZoom();
  const p=map.project(s.ll,z).add([0,innerHeight/2-targetY]);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  map.panTo(map.unproject(p,z),{animate:!reduce,duration:.5});
}

/* swipe down to close */
(function(){
  const sh=$("detail"); let y0=null,x0=0,dy=0,mode=null;
  sh.addEventListener("touchstart",e=>{const sc=$("detailBody").parentElement;if(sc.scrollTop>0)return;y0=e.touches[0].clientY;x0=e.touches[0].clientX;dy=0;mode=null},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0==null)return;const t=e.touches[0];dy=t.clientY-y0;const dx=t.clientX-x0;
    if(!mode&&(Math.abs(dx)>8||Math.abs(dy)>8)) mode=Math.abs(dx)>Math.abs(dy)?"x":"y";
    if(mode==="x"){y0=null;dy=0;return}
    if(mode==="y"&&dy>0){sh.style.transition="none";sh.style.transform=`translateY(${dy}px)`}},{passive:true});
  sh.addEventListener("touchend",()=>{if(y0==null)return;sh.style.transition="";sh.style.transform="";if(dy>90)closeAll();y0=null});
})();

/* list */
function openList(onlyEvents){
  const body=$("listBody"); body.textContent="";
  const pool=onlyEvents?SPOTS.filter(s=>s.tag):SPOTS;
  $("list").querySelector("h2").textContent=onlyEvents?"이번 일정 한정":"전체 목록";
  $("listCount").textContent=`${pool.length}곳`;
  CATS.forEach(c=>{
    const items=pool.filter(s=>s.cat===c.k); if(!items.length)return;
    const h=document.createElement("div"); h.className="grp-t"; h.style.setProperty("--c",cvar(c.k));
    h.innerHTML=`<i></i>${esc(c.t)} · ${items.length}`; body.append(h);
    items.forEach(s=>{
      const r=document.createElement("div"); r.className="row"; r.tabIndex=0; r.setAttribute("role","button");
      r.style.setProperty("--c",cvar(s.cat));
      r.innerHTML=`<div class="th" style="${s.photos&&s.photos.length?`background-image:url('${esc(s.photos[0].u)}')`:""}"><b>${s.n}</b></div>
        <div class="tx"><div class="nm">${esc(s.ko)}${s.tag?`<span class="evtag">${esc(s.tag)}</span>`:""}</div><div class="ar">${esc(s.jp)} · ${esc(s.area)}</div></div>`;
      const go=()=>openSpot(s.n,true);
      r.onclick=go; r.onkeydown=e=>{if(e.key==="Enter")go()};
      body.append(r);
    });
  });
  body.scrollTop=0;
  setSel(null); showSheet("list");
}
$("openList").onclick=()=>openList(false);
$("closeList").onclick=closeAll;

/* zoom */
$("zin").onclick=()=>map.zoomIn();
$("zout").onclick=()=>map.zoomOut();

/* current location */
let meMarker=null, meCircle=null, watchId=null, firstFix=true;
const toastEl=$("toast"); let toastT;
function toast(html,ms=5000){toastEl.innerHTML=html;toastEl.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove("on"),ms)}
const inArea=ll=>map.options.maxBounds.contains(ll);
const FAR_MSG="지금은 후쿠오카 밖에 있어서 지도에 표시할 수 없어요. 여행지에 도착하면 파란 점으로 위치가 보여요.";
function onFix(pos){
  const ll=[pos.coords.latitude,pos.coords.longitude];
  if(!meMarker){
    meCircle=L.circle(ll,{radius:pos.coords.accuracy,color:"#2f6fec",weight:1,fillOpacity:.12,interactive:false}).addTo(map);
    meMarker=L.marker(ll,{icon:L.divIcon({className:"pinwrap",html:'<div class="me-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:2000,keyboard:false}).addTo(map);
  } else {meMarker.setLatLng(ll);meCircle.setLatLng(ll).setRadius(pos.coords.accuracy)}
  if(firstFix){
    firstFix=false; toastEl.classList.remove("on");
    if(inArea(ll)) map.panTo(ll); else toast(FAR_MSG,6000);
  }
}
function stopWatch(){if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null}
function startWatch(high){
  stopWatch();
  watchId=navigator.geolocation.watchPosition(onFix,err=>{
    if(!firstFix) return;            // already located once; ignore a transient miss
    if(high&&err.code!==1){startWatch(false);return}   // retry with network-based location
    stopWatch(); $("locate").classList.remove("on");
    const mac=/Macintosh/.test(navigator.userAgent)&&!("ontouchend" in document);
    const msg=err.code===1
      ? "위치 권한이 거부됐어요. 주소창 왼쪽 자물쇠(또는 aA) 메뉴에서 위치를 '허용'으로 바꾼 뒤 다시 눌러 주세요."
      : mac
        ? "Mac에서 위치를 받지 못했어요. 시스템 설정 › 개인정보 보호 및 보안 › 위치 서비스에서 사용 중인 브라우저를 켜 주세요."
        : "위치를 받지 못했어요. 휴대폰의 위치 서비스가 켜져 있는지 확인한 뒤 다시 눌러 주세요.";
    toast(`${msg} <a href="https://www.google.com/maps/@33.59,130.40,13z" target="_blank" rel="noopener">Google 지도에서 보기</a>`,9000);
  },high?{enableHighAccuracy:true,timeout:10000,maximumAge:10000}:{enableHighAccuracy:false,timeout:20000,maximumAge:300000});
}
$("locate").onclick=()=>{
  if(meMarker&&!firstFix){
    const ll=meMarker.getLatLng();
    if(inArea(ll)) map.panTo(ll); else toast(FAR_MSG,6000);
    return;
  }
  if(!("geolocation" in navigator)){toast("이 브라우저는 위치 기능을 지원하지 않아요.");return}
  $("locate").classList.add("on");
  toast("현재 위치를 찾는 중…",4000);
  try{startWatch(true)}catch(e){$("locate").classList.remove("on");toast("이 화면에서는 위치 기능을 쓸 수 없어요.")}
};
</script>
